name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install tkinter (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y python3-tk

      - name: Build executable
        run: pyinstaller --onefile --windowed --name manga-recommender --hidden-import PIL._tkinter_finder main.py

      - name: Rename binary
        shell: bash
        run: |
          if [ '${{ matrix.os }}' = 'windows-latest' ]; then
            mv dist/manga-recommender.exe dist/manga-recommender-windows.exe
          elif [ '${{ matrix.os }}' = 'macos-latest' ]; then
            mv dist/manga-recommender dist/manga-recommender-macos
          else
            mv dist/manga-recommender dist/manga-recommender-linux
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/manga-recommender-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: binary-*/manga-recommender-*